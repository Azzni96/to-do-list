<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>🎨 Draw & Save</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to right, #f4f4f4, #e8f0ff);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 40px;
    }
    h2 {
      margin-top: 20px;
      color: #1d3557;
      text-shadow: 1px 1px 1px rgba(0,0,0,0.1);
    }
    canvas {
      border: 2px solid #1d3557;
      margin-top: 20px;
      background-color: #fff;
      background-image:
        linear-gradient(to right, rgba(0,0,0,0.05) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0,0,0,0.05) 1px, transparent 1px);
      background-size: 20px 20px;
      cursor: crosshair;
    }
    #controls {
      margin-top: 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      max-width: 900px;
    }
    #controls button,
    #controls input,
    #controls select {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 14px;
      min-width: 100px;
      background: #f9f9f9;
      transition: 0.2s;
    }
    #controls button:hover {
      background-color: #457b9d;
      color: #fff;
    }
    #undoCounter {
      margin-top: 10px;
      font-weight: bold;
      color: #1d3557;
    }
    @media (max-width: 600px) {
      canvas {
        width: 90vw;
        height: 90vw;
      }
    }
  </style>
</head>
<body>
  <h2>✏️ Draw & Save Your Artwork</h2>
  <canvas id="drawCanvas" width="600" height="600"></canvas>
  <div id="controls">
    <input type="color" id="colorPicker" value="#000000" />
    <input type="range" id="brushSize" min="1" max="20" value="4" />
    <select id="tool">
      <option value="pen">✏️ Pen</option>
      <option value="line">📏 Line</option>
      <option value="rect">⬛ Rectangle</option>
      <option value="circle">⚪ Circle</option>
      <option value="triangle">🔺 Triangle</option>
      <option value="polygon">🧷 Polygon</option>
      <option value="star">⭐ Star</option>
      <option value="text">💬 Text</option>
      <option value="move">🧭 Move</option>
      <option value="fill">🖍️ Fill</option>
    </select>
    <input type="text" id="textInput" placeholder="Your note..." style="width: 140px" />
    <button onclick="toggleEraser()">🧲 Eraser</button>
    <button onclick="undoLast()">↩️ Undo</button>
    <button onclick="clearCanvas()">🧹 Clear</button>
    <button onclick="saveAsImage()">💾 Save PNG</button>
    <button onclick="printCanvas()">🖨️ Print</button>
    <button onclick="saveAsJSON()">🧠 Save JSON</button>
    <input type="file" accept="image/*" onchange="importImage(event)" />
  </div>
  <div id="undoCounter">🧮 Undo Steps: 0</div>

  <script>
    const canvas = document.getElementById('drawCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    let isDrawing = false, isEraser = false, moving = false;
    let lastX = 0, lastY = 0;
    let undoStack = [], moveData = null;

    const colorPicker = document.getElementById('colorPicker');
    const brushSize = document.getElementById('brushSize');
    const toolSelect = document.getElementById('tool');
    const textInput = document.getElementById('textInput');

    function updateUndoCounter() {
      document.getElementById("undoCounter").innerText = `🧮 Undo Steps: ${undoStack.length}`;
    }

    function saveState() {
      undoStack.push(canvas.toDataURL());
      if (undoStack.length > 30) undoStack.shift();
      updateUndoCounter();
    }

    function undoLast() {
      if (undoStack.length === 0) return;
      const img = new Image();
      img.onload = () => ctx.drawImage(img, 0, 0);
      img.src = undoStack.pop();
      updateUndoCounter();
    }

    function getCoords(e) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (e.clientX || e.touches?.[0].clientX) - rect.left,
        y: (e.clientY || e.touches?.[0].clientY) - rect.top
      };
    }

    canvas.addEventListener('mousedown', (e) => {
      const { x, y } = getCoords(e);
      lastX = x; lastY = y;
      isDrawing = true;
      if (toolSelect.value === 'move') {
        moveData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        moving = true;
        return;
      }
      saveState();
    });

    canvas.addEventListener('mouseup', (e) => {
      const { x, y } = getCoords(e);
      if (toolSelect.value === 'move') {
        moving = false;
        return;
      }
      isDrawing = false;
      ctx.strokeStyle = ctx.fillStyle = isEraser ? '#fff' : colorPicker.value;
      ctx.lineWidth = brushSize.value;
      ctx.beginPath();
      switch(toolSelect.value) {
        case 'rect': ctx.fillRect(lastX, lastY, x - lastX, y - lastY); break;
        case 'circle':
          ctx.arc(lastX, lastY, Math.hypot(x - lastX, y - lastY), 0, Math.PI * 2);
          ctx.fill(); break;
        case 'triangle':
          ctx.moveTo(lastX, lastY);
          ctx.lineTo(x, y);
          ctx.lineTo(2 * lastX - x, y);
          ctx.closePath();
          ctx.fill(); break;
        case 'line':
          ctx.moveTo(lastX, lastY);
          ctx.lineTo(x, y);
          ctx.stroke(); break;
        case 'text':
          ctx.font = `${brushSize.value * 4}px Arial`;
          ctx.fillText(textInput.value || 'Note', x, y); break;
        case 'polygon': drawPolygon(lastX, lastY, 5, Math.hypot(x - lastX, y - lastY)); break;
        case 'star': drawStar(lastX, lastY, 5, Math.hypot(x - lastX, y - lastY)); break;
      }
    });

    canvas.addEventListener('mousemove', (e) => {
      const { x, y } = getCoords(e);
      if (moving && moveData) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.putImageData(moveData, x - lastX, y - lastY);
      }
      if (!isDrawing || toolSelect.value !== 'pen') return;
      ctx.strokeStyle = isEraser ? '#fff' : colorPicker.value;
      ctx.lineWidth = brushSize.value;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(lastX, lastY);
      ctx.lineTo(x, y);
      ctx.stroke();
      lastX = x; lastY = y;
    });

    function drawPolygon(cx, cy, sides, radius) {
      const angle = (Math.PI * 2) / sides;
      ctx.beginPath();
      for (let i = 0; i <= sides; i++) {
        const x = cx + radius * Math.cos(i * angle);
        const y = cy + radius * Math.sin(i * angle);
        i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.fill();
    }

    function drawStar(cx, cy, spikes, outer, inner = outer / 2) {
      let rot = Math.PI / 2 * 3;
      let x = cx;
      let y = cy;
      const step = Math.PI / spikes;
      ctx.beginPath();
      ctx.moveTo(cx, cy - outer);
      for (let i = 0; i < spikes; i++) {
        x = cx + Math.cos(rot) * outer;
        y = cy + Math.sin(rot) * outer;
        ctx.lineTo(x, y);
        rot += step;
        x = cx + Math.cos(rot) * inner;
        y = cy + Math.sin(rot) * inner;
        ctx.lineTo(x, y);
        rot += step;
      }
      ctx.lineTo(cx, cy - outer);
      ctx.closePath();
      ctx.fill();
    }

    function toggleEraser() {
      isEraser = !isEraser;
    }

    function clearCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      undoStack = [];
      updateUndoCounter();
    }

    function saveAsImage() {
      const link = document.createElement('a');
      link.download = 'drawing.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    function printCanvas() {
      const win = window.open();
      win.document.write(`<img src="${canvas.toDataURL()}" style="width:100%">`);
      win.print();
    }

    function saveAsJSON() {
      const data = JSON.stringify({ image: canvas.toDataURL() });
      const blob = new Blob([data], { type: 'application/json' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'drawing.json';
      link.click();
    }

    function importImage(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        const img = new Image();
        img.onload = () => ctx.drawImage(img, 0, 0);
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }
  </script>
</body>
</html>
