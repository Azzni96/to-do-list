<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>📝 My Notes</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(135deg, #e0f7fa, #f9fbe7);
      color: #333;
      padding: 20px;
      min-height: 100vh;
      transition: 0.3s;
    }
    body.dark {
      background: #121212;
      color: #eee;
    }
    .container {
      max-width: 900px;
      margin: auto;
    }
    h1 {
      text-align: center;
      margin-bottom: 15px;
      color: #18188e;
    }
    body.dark h1 { color: #4fc3f7; }

    textarea, input[type="text"], select {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 16px;
    }
    body.dark textarea, body.dark input[type="text"], body.dark select {
      background: #1e1e1e;
      color: white;
      border: 1px solid #555;
    }
    .note.work {
  background: #e3f2fd;
  border-left: 5px solid #2196f3;
}
.note.personal {
  background: #fce4ec;
  border-left: 5px solid #ec407a;
}
.note.ideas {
  background: #fff9c4;
  border-left: 5px solid #fbc02d;
}

body.dark .note.work {
  background: #1e3a5f;
  border-left-color: #42a5f5;
}
body.dark .note.personal {
  background: #5b2c3b;
  border-left-color: #f06292;
}
body.dark .note.ideas {
  background: #5a4a00;
  border-left-color: #fff176;
}

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin: 5px;
    }
    .add-btn { background: #2ecc71; color: white; }
    .edit-btn { background: #3498db; color: white; }
    .delete-btn { background: #e74c3c; color: white; }
    .back-btn { background: #18188e; color: white; }
    .theme-btn {
      background: #444; color: white;
      position: fixed; top: 20px; left: 20px;
    }

    .note {
      background: #f5f5f5;
      border-left: 5px solid #18188e;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 10px;
    }
    body.dark .note { background: #292929; border-left-color: #4fc3f7; }

    .note small { display: block; color: gray; margin-bottom: 5px; }
    body.dark .note small { color: #aaa; }

    .actions {
      margin-top: 10px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
    <div id="lock-screen" style="position:fixed; top:0; left:0; width:100%; height:100%; background:#121212cc; display:flex; align-items:center; justify-content:center; z-index:9999;">
        <div style="background:white; padding:30px; border-radius:10px; text-align:center; max-width:300px; width:100%;">
          <h3>🔒 Enter Password</h3>
          <input type="password" id="unlock-password" placeholder="••••" style="padding:10px; width:100%; margin:15px 0; border-radius:8px;" />
          <button onclick="checkPassword()" class="btn add-btn">🔓 Unlock</button>
          <p id="error-msg" style="color:red; margin-top:10px;"></p>
        </div>
      </div>
      
<audio id="reminder-sound" src="add.wav" preload="auto"></audio>

  <button class="btn theme-btn" onclick="toggleTheme()">🌗 Toggle Dark Mode</button>

  <div class="container">
    <h1>📝 My Notes</h1>
    <div style="margin-bottom: 10px;">
        <button class="btn" onclick="showCategory('Work')">💼 Work</button>
        <button class="btn" onclick="showCategory('Personal')">🏠 Personal</button>
        <button class="btn" onclick="showCategory('Ideas')">💡 Ideas</button>
        <button class="btn" onclick="renderNotes()">📋 All Notes</button>
      </div>
      
    <button class="btn back-btn" onclick="window.location.href='index.html'">🔙 Back to Home</button>

    <input type="text" id="search-input" placeholder="🔍 Search notes..." oninput="searchNotes()" />
    <select id="filter-category" onchange="filterByCategory()">
      <option value="">📁 Show All Categories</option>
      <option value="Work">💼 Work</option>
      <option value="Personal">🏠 Personal</option>
      <option value="Ideas">💡 Ideas</option>
    </select>

    <input type="text" id="note-title" placeholder="📌 Note Title" />
    <select id="note-category">
      <option value="">📂 Select Category</option>
      <option value="Work">💼 Work</option>
      <option value="Personal">🏠 Personal</option>
      <option value="Ideas">💡 Ideas</option>
    </select>
    <input type="text" id="note-tags" placeholder="🏷 Tags (comma separated)" />
    <input type="date" id="note-reminder" />

    <textarea id="note-text" rows="4" placeholder="✍️ Write your note here..."></textarea>
    <button class="btn add-btn" onclick="saveNote()">💾 Save Note</button>

    <button class="btn" onclick="exportAsTXT()">📄 Export as TXT</button>
    <button class="btn" onclick="exportAsJSON()">📦 Export as JSON</button>
    <button class="btn" onclick="exportAsPDF()">📃 Export as PDF</button>
    <input type="file" id="import-file" accept=".json" onchange="importNotes()" style="display: none;" />
    <button class="btn" onclick="document.getElementById('import-file').click()">📥 Import JSON</button>

    <div id="message" style="margin-top: 10px; font-weight: bold;"></div>
    <div id="notes-list"></div>
  </div>

  <script>

    let notes = JSON.parse(localStorage.getItem("notesList")) || [];
    let editIndex = null;
    let draggedIndex = null;


    function renderNotes(filtered = notes) {
      const list = document.getElementById("notes-list");
      list.innerHTML = "";
      const sorted = [...filtered].sort((a, b) => (b.pinned === true) - (a.pinned === true));
      sorted.forEach((note, index) => {
        const noteDiv = document.createElement("div");
        let categoryClass = "";
        if (note.category === "Work") categoryClass = "work";
        else if (note.category === "Personal") categoryClass = "personal";
        else if (note.category === "Ideas") categoryClass = "ideas";

        noteDiv.className = `note ${categoryClass}`;

        noteDiv.setAttribute("draggable", "true");
        noteDiv.setAttribute("ondragstart", `startDrag(${index})`);
        noteDiv.setAttribute("ondragover", "event.preventDefault()");
        noteDiv.setAttribute("ondrop", `dropNote(${index})`);

        noteDiv.innerHTML = `
          <strong>${note.title}</strong>
          <small>📅 ${note.date}${note.category ? ' | 🏷 ' + note.category : ''}</small>
          ${note.reminder ? '<small>⏰ Reminder: ' + note.reminder + checkReminder(note.reminder) + '</small>' : ''}

          ${note.tags && note.tags.length > 0 ? '<small>🏷 Tags: ' + note.tags.join(', ') + '</small>' : ''}
          <p>${note.text}</p>
          <div class="actions">
            <button class="btn" onclick="togglePin(${index})">${note.pinned ? '📍 Unpin' : '📌 Pin'}</button>
            <button class="btn edit-btn" onclick="editNote(${index})">✏️ Edit</button>
            <button class="btn delete-btn" onclick="deleteNote(${index})">🗑️ Delete</button>
          </div>
        `;
        list.appendChild(noteDiv);
      });
    }

    function saveNote() {
      const title = document.getElementById("note-title").value.trim();
      const text = document.getElementById("note-text").value.trim();
      const category = document.getElementById("note-category").value;
      const tags = document.getElementById("note-tags").value.split(',').map(tag => tag.trim()).filter(tag => tag !== "");
      const reminder = document.getElementById("note-reminder").value;


      if (!text || !title) return alert("❗ Please fill in both title and content!");
      const now = new Date().toLocaleString("en-US");

      if (editIndex !== null) {
        notes[editIndex] = { ...notes[editIndex], title, text, category, tags, reminder, date: now };
        showMessage("✏️ Note updated successfully!");
        editIndex = null;
      } else {
        notes.unshift({ title, text, category, tags, reminder, date: now, pinned: false });
        showMessage("✅ Note saved successfully!");
      }
      
      localStorage.setItem("notesList", JSON.stringify(notes));
      document.getElementById("note-title").value = "";
      document.getElementById("note-text").value = "";
      document.getElementById("note-tags").value = "";
      document.getElementById("note-reminder").value = "";

      renderNotes();
    }

    function editNote(index) {
      document.getElementById("note-title").value = notes[index].title;
      document.getElementById("note-text").value = notes[index].text;
      document.getElementById("note-category").value = notes[index].category;
      document.getElementById("note-reminder").value = notes[index].reminder || "";
      editIndex = index;
    }
    function startDrag(index) {
  draggedIndex = index;
}

function dropNote(targetIndex) {
  if (draggedIndex === null || draggedIndex === targetIndex) return;

  const draggedNote = notes[draggedIndex];
  notes.splice(draggedIndex, 1);
  notes.splice(targetIndex, 0, draggedNote);

  draggedIndex = null;
  localStorage.setItem("notesList", JSON.stringify(notes));
  renderNotes();
}


    function deleteNote(index) {
      if (confirm("Are you sure you want to delete this note?")) {
        notes.splice(index, 1);
        localStorage.setItem("notesList", JSON.stringify(notes));
        renderNotes();
      }
    }

    function togglePin(index) {
      notes[index].pinned = !notes[index].pinned;
      localStorage.setItem("notesList", JSON.stringify(notes));
      renderNotes();
    }

    function searchNotes() {
      const query = document.getElementById("search-input").value.toLowerCase();
      const filtered = notes.filter(note =>
        note.title.toLowerCase().includes(query) || note.text.toLowerCase().includes(query)
      );
      renderNotes(filtered);
    }

    function filterByCategory() {
      const selected = document.getElementById("filter-category").value;
      if (!selected) {
        renderNotes();
      } else {
        const filtered = notes.filter(note => note.category === selected);
        renderNotes(filtered);
      }
    }
    function checkReminder(reminderDate) {
        const today = new Date().toISOString().split("T")[0];
        if (reminderDate <= today) {
            return ' 🔔';
        }
        return '';
}

    function showCategory(category) {
    const filtered = notes.filter(note => note.category === category);
    renderNotes(filtered);
    showMessage(`📂 Showing only: ${category}`);
    }
    function checkRemindersOnLoad() {
  const today = new Date().toISOString().split("T")[0];
  const dueNotes = notes.filter(note => note.reminder && note.reminder <= today);

  if (dueNotes.length > 0) {
    showMessage(`🔔 You have ${dueNotes.length} reminder(s) due today!`);

    // انتظر تفاعل المستخدم قبل تشغيل الصوت
    document.body.addEventListener("click", () => {
      const sound = document.getElementById("reminder-sound");
      if (sound) sound.play();
    }, { once: true });
  }
}



    function showMessage(msg) {
      const msgDiv = document.getElementById("message");
      msgDiv.textContent = msg;
      msgDiv.style.color = "#2ecc71";
      setTimeout(() => msgDiv.textContent = "", 3000);
    }

    function exportAsTXT() {
      if (notes.length === 0) return alert("📭 No notes to export!");
      let content = "";
      notes.forEach(note => {
        content += `📌 ${note.title || "Untitled"}\n`;
        content += `📅 ${note.date}${note.category ? " | 🏷 " + note.category : ""}\n`;
        content += `${note.text}\n\n-------------------\n\n`;
      });
      const blob = new Blob([content], { type: "text/plain" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "my-notes.txt";
      link.click();
    }

    function exportAsJSON() {
      if (notes.length === 0) return alert("📭 No notes to export!");
      const data = JSON.stringify(notes, null, 2);
      const blob = new Blob([data], { type: "application/json" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "my-notes.json";
      link.click();
    }

    async function exportAsPDF() {
      if (notes.length === 0) return alert("📭 No notes to export!");
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      let y = 10;
      notes.forEach(note => {
        doc.setFontSize(12);
        doc.text(`📌 ${note.title || "Untitled"}`, 10, y); y += 7;
        doc.setFontSize(10);
        doc.text(`📅 ${note.date}${note.category ? " | 🏷 " + note.category : ""}`, 10, y); y += 6;
        const lines = doc.splitTextToSize(note.text, 180);
        doc.text(lines, 10, y); y += lines.length * 6 + 10;
        if (y > 270) { doc.addPage(); y = 10; }
      });
      doc.save("my-notes.pdf");
    }

    function importNotes() {
      const file = document.getElementById("import-file").files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (!Array.isArray(imported)) return alert("❌ Invalid file format.");
          notes = [...imported, ...notes];
          localStorage.setItem("notesList", JSON.stringify(notes));
          showMessage("✅ Notes imported successfully!");
          renderNotes();
        } catch {
          alert("❌ Failed to import. Please check the file.");
        }
      };
      reader.readAsText(file);
    }

    function checkPassword() {
  const input = document.getElementById("unlock-password").value;
  const correctPassword = "1234"; // ✅ غيّرها إذا أردت

  if (input === correctPassword) {
    document.getElementById("lock-screen").style.display = "none";
  } else {
    document.getElementById("error-msg").textContent = "❌ Wrong password!";
  }
}

    function toggleTheme() {
      document.body.classList.toggle("dark");
      localStorage.setItem("themeNote", document.body.classList.contains("dark") ? "dark" : "light");
    }

    window.onload = () => {
      if (localStorage.getItem("themeNote") === "dark") {
        document.body.classList.add("dark");
      }
      renderNotes();
      checkRemindersOnLoad(); 
    };
  </script>

</body>
</html>
