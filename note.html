<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>📝 My Notes</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(to right, #e0f7fa, #f9fbe7);
      color: #333;
      padding: 20px;
      min-height: 100vh;
      transition: 0.3s ease;
    }

    body.dark {
      background: #1a1a1a;
      color: #f1f1f1;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }

    .left-panel, .right-panel {
      flex: 1;
      padding: 20px;
    }

    .form-container {
      background: rgba(255, 255, 255, 0.98);
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      padding: 20px;
      transition: background 0.3s ease;
    }
    body.dark .form-container {
      background: rgba(40, 40, 40, 0.95);
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
      color: #18188e;
      font-size: 2.2rem;
    }
    body.dark h1 {
      color: #4fc3f7;
    }

    textarea,
    input[type="text"],
    input[type="date"],
    select {
      width: 100%;
      padding: 14px;
      margin-bottom: 14px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 16px;
      background: #fff;
      color: #333;
      transition: all 0.2s ease;
    }
    textarea:focus,
    input:focus,
    select:focus {
      border-color: #18188e;
      outline: none;
    }
    body.dark textarea,
    body.dark input,
    body.dark select {
      background: #1e1e1e;
      color: #f1f1f1;
      border: 1px solid #555;
    }

    select#note-category {
      background: #f4f4f4;
    }
    body.dark select#note-category {
      background: #2a2a2a;
      color: #f1f1f1;
    }

    .btn {
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      margin: 6px 6px 6px 0;
      transition: all 0.2s ease;
    }
    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    .add-btn { background: #2ecc71; color: white; }
    .edit-btn { background: #3498db; color: white; }
    .delete-btn { background: #e74c3c; color: white; }
    .back-btn { background: #18188e; color: white; }
    .theme-btn {
      background: #444;
      color: white;
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 1000;
      padding: 8px 14px;
      font-size: 14px;
    }

    .note {
      background: #f5f5f5;
      border-left: 5px solid #18188e;
      padding: 15px 20px;
      border-radius: 12px;
      margin-bottom: 15px;
      transition: all 0.2s ease;
    }
    .note:hover {
      background: #f0f8ff;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }
    body.dark .note {
      background: #2c2c2c;
      border-left-color: #4fc3f7;
    }
    .note small {
      display: block;
      color: gray;
      margin-bottom: 5px;
    }
    body.dark .note small {
      color: #aaa;
    }

    .actions {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    #message {
      text-align: center;
      padding: 10px;
      font-weight: bold;
    }

    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }
      .btn {
        width: 100%;
        margin: 5px 0;
      }
      .actions {
        flex-direction: column;
        gap: 6px;
      }
      .theme-btn {
        top: 10px;
        left: 10px;
      }
    }
    </style>
    
</head>
<body>
  <div id="mainContent">
    <audio id="reminder-sound" src="add.wav" preload="auto"></audio>
  <button class="btn theme-btn" onclick="toggleTheme()" aria-label="Toggle dark mode">🌗 Toggle Dark Mode</button>
    <div class="container">
      <div class="left-panel">
        <h1>🗂 Notes List</h1>
        <input type="text" id="search-input" placeholder="🔍 Search notes..." oninput="searchNotes()" />
        <div style="margin-bottom: 20px;">
          <button class="btn" onclick="showCategory('Work')" aria-label="Show work notes">💼 Work</button>
          <button class="btn" onclick="showCategory('Personal')" aria-label="Show personal notes">🏠 Personal</button>
          <button class="btn" onclick="showCategory('Ideas')" aria-label="Show idea notes">💡 Ideas</button>
    <button class="btn" onclick="renderNotes()" aria-label="Show all notes">📋 All Notes</button>
        </div>
  <button class="btn" onclick="printNotes()" aria-label="Print notes">🖨️ Print Notes</button>
        <div id="notes-list"></div>
      </div>
      <div class="right-panel">
        <div class="form-container">
          <h1>📝 Add Note</h1>
          <input type="text" id="note-title" placeholder="📌 Note Title" />
          <select id="note-category">
            <option value="">📁 Choose Category</option>
            <option value="Work">💼 Work</option>
            <option value="Personal">🏠 Personal</option>
            <option value="Ideas">💡 Ideas</option>
          </select>
          <input type="date" id="note-reminder" />
          <textarea id="note-text" rows="4" placeholder="✍️ Write your note here..."></textarea>
          <button class="btn add-btn" onclick="saveNote()" aria-label="Save note">📀 Save Note</button>
          <div id="message" style="margin-top: 10px; font-weight: bold;"></div>
        </div>
        <button class="btn" onclick="exportAsTXT()">📄 Export as TXT</button>
        <button class="btn" onclick="exportAsJSON()">📦 Export as JSON</button>
        <button class="btn" onclick="exportAsPDF()">📃 Export as PDF</button>
        <input type="file" id="import-file" accept=".json" onchange="importNotes()" style="display: none;" />
        <button class="btn" onclick="document.getElementById('import-file').click()">📥 Import JSON</button>
        <button class="btn back-btn" onclick="window.location.href='index.html'">🔙 Back to Home</button> 
      </div>
    </div>
  </div>

  <script>

    let notes = JSON.parse(localStorage.getItem("notesList")) || [];
    let editIndex = null;
    let draggedIndex = null;

    function renderNotes(filtered = notes) {
      const list = document.getElementById("notes-list");
      list.innerHTML = "";
      const sorted = [...filtered].sort((a, b) => (b.pinned === true) - (a.pinned === true));
      sorted.forEach((note, index) => {
        const noteDiv = document.createElement("div");
        let categoryClass = "";
        if (note.category === "Work") categoryClass = "work";
        else if (note.category === "Personal") categoryClass = "personal";
        else if (note.category === "Ideas") categoryClass = "ideas";

        noteDiv.className = `note ${categoryClass}`;

        noteDiv.setAttribute("draggable", "true");
        noteDiv.setAttribute("ondragstart", `startDrag(${index})`);
        noteDiv.setAttribute("ondragover", "event.preventDefault()");
        noteDiv.setAttribute("ondrop", `dropNote(${index})`);

        noteDiv.innerHTML = `
          <strong>${note.title}</strong>
          <small>📅 ${note.date}${note.category ? ' | 🏷 ' + note.category : ''}</small>
          ${note.reminder ? '<small>⏰ Reminder: ' + note.reminder + checkReminder(note.reminder) + '</small>' : ''}
          <p>${note.text}</p>
          <div class="actions">
            <button class="btn" onclick="togglePin(${index})">${note.pinned ? '📍 Unpin' : '📌 Pin'}</button>
            <button class="btn edit-btn" onclick="editNote(${index})">✏️ Edit</button>
            <button class="btn delete-btn" onclick="deleteNote(${index})">🗑️ Delete</button>
          </div>
        `;
        list.appendChild(noteDiv);
      });
    }

    function saveNote() {
      const title = document.getElementById("note-title").value.trim();
      const text = document.getElementById("note-text").value.trim();
      const reminder = document.getElementById("note-reminder").value;
      const category = document.getElementById("note-category").value;

      if (!text || !title) return alert("❗ Please fill in both title and content!");
      const now = new Date().toLocaleString("en-US");

      const noteData = { title, text, category, reminder, date: now, pinned: false };

      if (editIndex !== null) {
        notes[editIndex] = { ...notes[editIndex], ...noteData };
        showMessage("✏️ Note updated successfully!");
        editIndex = null;
      } else {
        notes.unshift(noteData);
        showMessage("✅ Note saved successfully!");
      }

      localStorage.setItem("notesList", JSON.stringify(notes));

      // Clear inputs
      document.getElementById("note-title").value = "";
      document.getElementById("note-text").value = "";
      document.getElementById("note-reminder").value = "";
      document.getElementById("note-category").value = "";

      renderNotes();
    }

    function editNote(index) {
      document.getElementById("note-text").value = notes[index].text;
      document.getElementById("note-reminder").value = notes[index].reminder || "";
      document.getElementById("note-title").value = notes[index].title;
      document.getElementById("note-category").value = notes[index].category || "";
      editIndex = index;
    }

    function startDrag(index) {
      draggedIndex = index;
    }

    function dropNote(targetIndex) {
      if (draggedIndex === null || draggedIndex === targetIndex) return;

      const draggedNote = notes[draggedIndex];
      notes.splice(draggedIndex, 1);
      notes.splice(targetIndex, 0, draggedNote);

      draggedIndex = null;
      localStorage.setItem("notesList", JSON.stringify(notes));
      renderNotes();
    }

    function deleteNote(index) {
      if (confirm("Are you sure you want to delete this note?")) {
        notes.splice(index, 1);
        localStorage.setItem("notesList", JSON.stringify(notes));
        renderNotes();
      }
    }

    function togglePin(index) {
      notes[index].pinned = !notes[index].pinned;
      localStorage.setItem("notesList", JSON.stringify(notes));
      renderNotes();
    }

    function searchNotes() {
      const query = document.getElementById("search-input").value.toLowerCase();
      const filtered = notes.filter(note =>
        note.title.toLowerCase().includes(query) || note.text.toLowerCase().includes(query)
      );
      renderNotes(filtered);
    }

    function checkReminder(reminderDate) {
      const today = new Date().toISOString().split("T")[0];
      if (reminderDate <= today) {
        return ' 🔔';
      }
      return '';
    }

    function showCategory(category) {
      const filtered = notes.filter(note => note.category === category);
      renderNotes(filtered);
      showMessage(`📂 Showing only: ${category}`);
    }

    function checkRemindersOnLoad() {
      const today = new Date().toISOString().split("T")[0];
      const dueNotes = notes.filter(note => note.reminder && note.reminder <= today);

      if (dueNotes.length > 0) {
        showMessage(`🔔 You have ${dueNotes.length} reminder(s) due today!`);

        // انتظر تفاعل المستخدم قبل تشغيل الصوت
        document.body.addEventListener("click", () => {
          const sound = document.getElementById("reminder-sound");
          if (sound) sound.play();
        }, { once: true });
      }
    }

    function showMessage(msg) {
      const msgDiv = document.getElementById("message");
      msgDiv.textContent = msg;
      msgDiv.style.color = "#2ecc71";
      setTimeout(() => msgDiv.textContent = "", 3000);
    }

    function exportAsTXT() {
      if (notes.length === 0) return alert("📭 No notes to export!");
      let content = "";
      notes.forEach(note => {
        content += `📌 ${note.title || "Untitled"}\n`;
        content += `📅 ${note.date}${note.category ? " | 🏷 " + note.category : ""}\n`;
        content += `${note.text}\n\n-------------------\n\n`;
      });
      const blob = new Blob([content], { type: "text/plain" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "my-notes.txt";
      link.click();
    }

    function exportAsJSON() {
      if (notes.length === 0) return alert("📭 No notes to export!");
      const data = JSON.stringify(notes, null, 2);
      const blob = new Blob([data], { type: "application/json" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "my-notes.json";
      link.click();
    }

    async function exportAsPDF() {
      if (notes.length === 0) return alert("📭 No notes to export!");
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      let y = 10;
      notes.forEach(note => {
        doc.setFontSize(12);
        doc.text(`📌 ${note.title || "Untitled"}`, 10, y); y += 7;
        doc.setFontSize(10);
        doc.text(`📅 ${note.date}${note.category ? " | 🏷 " + note.category : ""}`, 10, y); y += 6;
        const lines = doc.splitTextToSize(note.text, 180);
        doc.text(lines, 10, y); y += lines.length * 6 + 10;
        if (y > 270) { doc.addPage(); y = 10; }
      });
      doc.save("my-notes.pdf");
    }

    function importNotes() {
      const file = document.getElementById("import-file").files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (!Array.isArray(imported)) return alert("❌ Invalid file format.");
          notes = [...imported, ...notes];
          localStorage.setItem("notesList", JSON.stringify(notes));
          showMessage("✅ Notes imported successfully!");
          renderNotes();
        } catch {
          alert("❌ Failed to import. Please check the file.");
        }
      };
      reader.readAsText(file);
    }

    function toggleTheme() {
      document.body.classList.toggle("dark");
      localStorage.setItem("themeNote", document.body.classList.contains("dark") ? "dark" : "light");
    }

    function printNotes() {
      const printContent = document.getElementById("notes-list").innerHTML;
      const originalContent = document.body.innerHTML;
      document.body.innerHTML = `<div>${printContent}</div>`;
      window.print();
      document.body.innerHTML = originalContent;
      location.reload(); // Reload to restore functionality
    }

    window.onload = () => {
      if (localStorage.getItem("themeNote") === "dark") {
        document.body.classList.add("dark");
      }
      renderNotes();
      checkRemindersOnLoad(); 
    };
  </script>

</body>
</html>
